<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#020611" />
  <title>برای ماه زندگی‌م آوین</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');

    :root{
      --bg:#020611;
      --blue:#4aa3ff;
      --light:#bfe6ff;
      --soft:#7cc7ff;
      --white:#eff9ff;
    }

    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{
      font-family:'Vazirmatn',Tahoma,Arial,sans-serif;
      color:var(--white);
      background:
        radial-gradient(circle at 50% 40%, rgba(26,108,180,.14), transparent 35%),
        linear-gradient(180deg,#020611 0%,#031126 55%,#020611 100%);
    }

    .scene{
      position:fixed;
      inset:0;
      opacity:1;
      visibility:visible;
      transition:opacity 1.2s ease, visibility 1.2s ease;
    }
    .scene.hidden{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    /* ---------- SCENE 1 ---------- */
    #intro{
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      isolation:isolate;
    }

    .stars{
      position:absolute;
      inset:0;
      overflow:hidden;
      z-index:0;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(130,210,255,.55) 0 1px, transparent 1.7px),
        radial-gradient(circle at 75% 30%, rgba(80,160,255,.42) 0 1px, transparent 1.5px),
        radial-gradient(circle at 50% 80%, rgba(180,230,255,.36) 0 1px, transparent 1.6px);
      background-size: 170px 170px, 210px 210px, 230px 230px;
      animation: drift 24s linear infinite;
      opacity:.75;
    }
    @keyframes drift{
      from{transform:translate3d(0,0,0)}
      to{transform:translate3d(-90px,50px,0)}
    }

    .glow{
      position:absolute;
      width:320px;height:320px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(38,142,255,.22), transparent 68%);
      filter:blur(12px);
      animation:pulse 4s ease-in-out infinite;
      z-index:0;
    }
    @keyframes pulse{
      0%,100%{transform:scale(.92);opacity:.65}
      50%{transform:scale(1.08);opacity:1}
    }

    .love-layer{
      position:absolute;
      inset:0;
      z-index:1;
      pointer-events:none;
    }

    .love{
      position:absolute;
      color:rgba(114,191,255,.72);
      font-size:clamp(9px,2vw,13px);
      white-space:nowrap;
      text-shadow:0 0 8px rgba(75,166,255,.35);
      animation:floatLove linear infinite;
      opacity:.18;
      user-select:none;
    }
    @keyframes floatLove{
      0%{transform:translate3d(0,110vh,0) rotate(-7deg);opacity:0}
      10%{opacity:.2}
      50%{opacity:.42}
      100%{transform:translate3d(35px,-15vh,0) rotate(8deg);opacity:0}
    }

    .intro-content{
      position:relative;
      z-index:2;
      text-align:center;
      padding:24px;
    }

    .mini{
      color:#92cbff;
      font-size:14px;
      letter-spacing:.5px;
      opacity:.9;
      margin-bottom:16px;
    }

    .intro-title{
      margin:0 0 28px;
      font-size:clamp(27px,8vw,54px);
      line-height:1.3;
      font-weight:700;
      color:#eaf7ff;
      text-shadow:0 0 14px rgba(76,174,255,.28),0 0 38px rgba(28,113,196,.18);
    }

    .start-btn{
      border:1px solid rgba(155,220,255,.55);
      background:linear-gradient(180deg,rgba(37,125,210,.34),rgba(6,30,61,.55));
      color:#f2fbff;
      padding:17px 44px;
      min-width:180px;
      border-radius:999px;
      font:600 17px 'Vazirmatn',Tahoma,Arial,sans-serif;
      cursor:pointer;
      box-shadow:0 0 0 1px rgba(53,144,230,.15),0 0 30px rgba(38,146,240,.2),inset 0 0 24px rgba(45,143,232,.08);
      backdrop-filter:blur(7px);
      -webkit-backdrop-filter:blur(7px);
      transition:transform .2s ease, box-shadow .25s ease;
    }
    .start-btn:active{transform:scale(.96)}
    .start-btn:hover{box-shadow:0 0 0 1px rgba(90,176,255,.28),0 0 40px rgba(38,146,240,.34),inset 0 0 24px rgba(45,143,232,.12)}

    .hint{
      margin-top:16px;
      color:rgba(202,234,255,.56);
      font-size:12px;
    }

    /* ---------- SCENE 2 ---------- */
    #letter{
      background:
        radial-gradient(circle at 50% 30%, rgba(62,161,255,.15), transparent 25%),
        radial-gradient(circle at 30% 70%, rgba(20,106,187,.13), transparent 28%),
        linear-gradient(180deg,#020817 0%,#04162e 48%,#020817 100%);
    }

    .moon{
      position:absolute;
      top:7vh;
      left:50%;
      transform:translateX(-50%);
      width:160px;height:160px;
      border-radius:50%;
      background:
        radial-gradient(circle at 36% 34%, rgba(255,255,255,.88) 0 2px, transparent 3px),
        radial-gradient(circle at 63% 24%, rgba(255,255,255,.55) 0 3px, transparent 4px),
        radial-gradient(circle at 54% 64%, rgba(50,105,150,.22) 0 14px, transparent 15px),
        radial-gradient(circle at 37% 60%, rgba(32,88,140,.18) 0 10px, transparent 11px),
        radial-gradient(circle, #f6fcff 0%, #d5edff 55%, #b6dcfb 100%);
      box-shadow:0 0 25px rgba(185,226,255,.72), 0 0 90px rgba(70,166,255,.34), 0 0 150px rgba(37,126,214,.16);
      animation:moonFloat 5s ease-in-out infinite;
    }
    @keyframes moonFloat{
      0%,100%{transform:translateX(-50%) translateY(0)}
      50%{transform:translateX(-50%) translateY(-8px)}
    }

    .moon-ring{
      position:absolute;
      top:calc(7vh - 22px);
      left:50%;
      width:204px;height:204px;
      transform:translateX(-50%);
      border-radius:50%;
      border:1px solid rgba(140,209,255,.18);
      box-shadow:0 0 35px rgba(82,174,255,.14) inset;
    }

    .letter-wrap{
      position:absolute;
      inset:0;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding:0 20px 8vh;
      overflow:auto;
    }

    .letter-card{
      width:min(650px,100%);
      padding:28px 24px 30px;
      border:1px solid rgba(127,202,255,.16);
      border-radius:28px;
      background:linear-gradient(180deg,rgba(6,31,60,.44),rgba(2,12,27,.6));
      box-shadow:0 20px 60px rgba(0,0,0,.28), inset 0 1px 0 rgba(198,234,255,.07);
      backdrop-filter:blur(13px);
      -webkit-backdrop-filter:blur(13px);
      text-align:center;
    }

    .for{
      margin:0 0 10px;
      color:#a4dcff;
      font-size:14px;
    }

    .name{
      margin:0 0 22px;
      font-size:clamp(25px,7vw,42px);
      color:#f0faff;
      font-weight:700;
      text-shadow:0 0 20px rgba(86,174,255,.25);
    }

    .message{
      margin:0 auto;
      max-width:560px;
      color:#dff2ff;
      font-size:clamp(14px,4.2vw,18px);
      line-height:2.15;
    }
    .message strong{
      color:#eefaff;
      font-weight:700;
    }

    .heart{
      display:inline-block;
      font-size:22px;
      animation:heartBeat 1.8s ease-in-out infinite;
      filter:drop-shadow(0 0 9px rgba(106,194,255,.35));
    }
    @keyframes heartBeat{
      0%,100%{transform:scale(1)}
      10%{transform:scale(1.16)}
      20%{transform:scale(1)}
      30%{transform:scale(1.1)}
    }

    .back-btn{
      margin-top:20px;
      padding:11px 20px;
      border-radius:999px;
      border:1px solid rgba(149,211,255,.22);
      background:rgba(13,51,91,.35);
      color:rgba(229,246,255,.78);
      font:500 13px 'Vazirmatn',Tahoma,Arial,sans-serif;
      cursor:pointer;
    }

    .floating-dot{
      position:absolute;
      width:4px;height:4px;border-radius:50%;
      background:#aee0ff;
      box-shadow:0 0 10px rgba(121,200,255,.85);
      opacity:.65;
      animation:rise linear infinite;
    }
    @keyframes rise{
      from{transform:translateY(15vh);opacity:0}
      15%{opacity:.65}
      85%{opacity:.3}
      to{transform:translateY(-110vh);opacity:0}
    }

    @media (max-height:650px){
      .moon{width:125px;height:125px;top:4vh}
      .moon-ring{top:calc(4vh - 17px);width:165px;height:165px}
      .letter-wrap{padding-bottom:4vh}
      .letter-card{padding:22px 18px}
      .name{margin-bottom:12px}
      .message{line-height:1.9}
    }
  </style>
</head>
<body>
  <section id="intro" class="scene">
    <div class="stars"></div>
    <div class="glow"></div>
    <div class="love-layer" id="loveLayer"></div>

    <div class="intro-content">
      <div class="mini">یه چیز کوچیک برای تو...</div>
      <h1 class="intro-title">برای ماهِ زندگی‌م آوین</h1>
      <button class="start-btn" id="startBtn">بزن روش ✦</button>
      <div class="hint">آروم بزن... ✨</div>
    </div>
  </section>

  <section id="letter" class="scene hidden">
    <div class="moon-ring"></div>
    <div class="moon"></div>
    <div id="dots"></div>

    <div class="letter-wrap">
      <div class="letter-card">
        <p class="for">برای ماهِ زندگی‌م</p>
        <h2 class="name">آوین</h2>
        <p class="message">
          امشب ماه کامل میشه.<br>
          درسته ماه همیشه کامل نیست،<br>
          ولی همیشه خوشگله.<br><br>
          و تو <strong>ماه زندگی‌می</strong> و امشب خواستم بیشتر حواسم بهت باشه
          و بگم که خیلی ممنونم ازت که تو زندگیم هستی<br>
          و خیلی دوست دارم <span class="heart">❤️</span>
        </p>
        <button class="back-btn" id="backBtn">دوباره از اول ✦</button>
      </div>
    </div>
  </section>

  <script>
    // Tiny moving "دوست دارم" particles
    const loveLayer = document.getElementById('loveLayer');
    const phrases = ['دوست دارم', 'خیلی دوست دارم', 'ماه من', 'آوین', 'دوستت دارم'];
    const loveCount = 42;

    for(let i=0;i<loveCount;i++){
      const span = document.createElement('span');
      span.className = 'love';
      span.textContent = phrases[Math.floor(Math.random()*phrases.length)];
      span.style.left = (Math.random()*100) + '%';
      span.style.animationDuration = (10 + Math.random()*14) + 's';
      span.style.animationDelay = (-Math.random()*18) + 's';
      span.style.fontSize = (9 + Math.random()*5) + 'px';
      span.style.opacity = (.10 + Math.random()*.28).toFixed(2);
      loveLayer.appendChild(span);
    }

    // Soft floating light particles for the second scene
    const dots = document.getElementById('dots');
    const dotCount = 24;
    for(let i=0;i<dotCount;i++){
      const d = document.createElement('span');
      d.className = 'floating-dot';
      d.style.left = (Math.random()*100) + '%';
      d.style.top = (72 + Math.random()*34) + '%';
      d.style.animationDuration = (9 + Math.random()*11) + 's';
      d.style.animationDelay = (-Math.random()*12) + 's';
      d.style.transform = `scale(${0.5 + Math.random()*1.4})`;
      dots.appendChild(d);
    }

    const intro = document.getElementById('intro');
    const letter = document.getElementById('letter');
    const startBtn = document.getElementById('startBtn');
    const backBtn = document.getElementById('backBtn');

    startBtn.addEventListener('click', () => {
      intro.classList.add('hidden');
      setTimeout(() => {
        letter.classList.remove('hidden');
      }, 250);
    });

    backBtn.addEventListener('click', () => {
      letter.classList.add('hidden');
      setTimeout(() => {
        intro.classList.remove('hidden');
      }, 250);
    });
  </script>
</body>
</html>
